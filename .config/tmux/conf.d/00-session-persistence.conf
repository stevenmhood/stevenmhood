# Session persistence (tmux-resurrect + tmux-continuum).
#
# Drop-in fragment sourced by ~/.tmux.conf's include-all-of-conf.d line.
# Owns only plugin declarations and plugin options — infrastructure
# (TMUX_PLUGIN_MANAGER_PATH, TPM bootstrap, trailing TPM `run`) lives in
# ~/.tmux.conf itself so the "TPM run must be last" invariant is enforced
# once across all fragments.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore allowlist.
#
# Why the double-tilde patterns: `~` matches the ps process name (`comm`),
# `~~` matches the full command line. Claude is installed as a versioned
# binary (`~/.local/share/claude/versions/2.1.117`, etc.) that a `claude`
# launcher exec's into, so the process name is the version number, not
# `claude` — only a full-command-line match catches it reliably. ashe is
# a Node script that spawns claude as a child; the pane's foreground
# process is the node parent, shown by ps as `node <abs-path-to-ashe> ...`.
#
# `"~~claude"` catches shell-alias `claude` invocations (full cmdline
# starts with "claude"). `"~~node /"` catches any `node /abs-path ...`
# invocation — includes ashe panes and picks up dev servers like
# `node /opt/.../pnpm run ...` as collateral. Dev-server restart isn't
# the goal but the occasional auto-restart is acceptable.
set -g @resurrect-processes '"~~claude" "~~node /"'
set -g @resurrect-capture-pane-contents 'on'

# Save every 15 min; auto-restore on an empty tmux server startup.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
