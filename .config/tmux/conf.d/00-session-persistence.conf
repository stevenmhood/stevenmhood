# Session persistence (tmux-resurrect + tmux-continuum).
#
# Drop-in fragment sourced by ~/.tmux.conf's include-all-of-conf.d line.
# Owns only plugin declarations and plugin options — infrastructure
# (TMUX_PLUGIN_MANAGER_PATH, TPM bootstrap, trailing TPM `run`) lives in
# ~/.tmux.conf itself so the "TPM run must be last" invariant is enforced
# once across all fragments.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore allowlist and inline strategies:
# https://github.com/tmux-plugins/tmux-resurrect/blob/master/docs/restoring_programs.md
set -g @resurrect-processes '"~claude->claude *" "~codex->codex *"'
set -g @resurrect-capture-pane-contents 'on'

# Save every 15 min; auto-restore on an empty tmux server startup.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Auto-restore only fires if continuum's plugin code runs within this many
# seconds of the tmux server starting (continuum's just_started_tmux_server
# gate). The upstream default is a mere 10s — on a cold boot, TPM plugin
# loading blows past that, restore silently never arms, and then the 15-min
# auto-save overwrites `last` with the empty session, orphaning the last good
# snapshot. Widening the window makes restore robust to slow startups.
set -g @continuum-restore-max-delay '600'
